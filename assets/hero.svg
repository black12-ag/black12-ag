 <text x="68" y="191" fill="#f2f5f0" font-size="70" font-weight="700" letter-spacing="-3">Ideas into</text>
 <text x="68" y="270" fill="#c9f48b" font-size="70" font-weight="700" letter-spacing="-3">working things.</text>
 <text x="72" y="326" fill="#d6e0e3" font-size="22">Full-stack development · AI · Mobile</text>
 <text x="72" y="364" fill="#9baeb9" font-size="18">From Addis Ababa, Ethiopia.</text>
 <path d="M72 413H510" stroke="#30414a"/>
 <text x="72" y="448" fill="#9baeb9" font-size="13" letter-spacing="2">CODE WITH PURPOSE. BUILD WITH CARE.</text>
</g>
